<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plumbing OSH – 20 MCQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.55}
header{background:linear-gradient(120deg,#123b70,#1976c9);color:white;text-align:center;padding:28px 16px}h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}header p{margin:0}
.wrap{max-width:850px;margin:24px auto;padding:0 14px}.status,.question,.result{background:white;border:1px solid #dce4ef;border-radius:12px;padding:18px;margin-bottom:16px}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress{height:9px;background:#e8eef7;border-radius:20px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:#1976c9}
.unit{font-size:12px;color:#1457a6;font-weight:bold;margin-bottom:8px}.qtop{display:flex;gap:10px}.num{background:#eaf2ff;color:#1457a6;padding:3px 9px;border-radius:7px;font-weight:bold;white-space:nowrap}
h3{font-size:18px;margin:0 0 14px}.option{display:block;padding:11px 12px;margin:8px 0;border:1px solid #dce4ef;border-radius:8px;cursor:pointer}.option:hover{background:#f5f9ff;border-color:#9bbce8}.option input{margin-right:8px;accent-color:#1457a6}.option.selected{background:#edf4ff;border-color:#1457a6}
.feedback{margin-top:10px;min-height:22px;font-size:14px}.good{color:#18733d}.bad{color:#b42318}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #dce4ef;padding-top:15px;margin-top:18px}
button{border:0;border-radius:8px;padding:11px 17px;font-size:15px;font-weight:bold;cursor:pointer}.primary{background:#1457a6;color:white}.secondary{background:#e4ebf5;color:#23334d}button:disabled{opacity:.4;cursor:not-allowed}
.result{text-align:center;display:none}.score{font-size:30px;color:#1457a6;font-weight:bold}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 30px}
footer{text-align:center;color:#65728a;padding:20px;font-size:13px}
@media print{header{background:white;color:black}.status,.nav,.actions{display:none}.question{break-inside:avoid}}
</style></head><body>
<header><h1>Apply Occupational Safety and Health (OSH)</h1><p>Plumbing Workplace | ২০টি বহুনির্বাচনী প্রশ্ন</p></header>
<main class="wrap">
<div class="status"><div><b>মোট প্রশ্ন: ২০টি</b><div style="font-size:13px;color:#65728a">একবারে একটি প্রশ্ন দেখানো হবে</div></div><div style="min-width:190px;flex:1;max-width:340px"><div id="count">উত্তর দিয়েছেন: ০/২০</div><div class="progress"><div class="bar" id="bar"></div></div></div></div>
<div id="quiz"></div><section class="result" id="result"></section>
<div class="actions"><button class="secondary" onclick="resetQuiz()">আবার শুরু করুন</button><button class="secondary" onclick="window.print()">প্রিন্ট করুন</button></div>
</main><footer>Plumbing – Occupational Safety and Health (OSH) MCQ</footer>
<script>
const questions = [["OSH in Plumbing Workplace", "কাজ শুরু করার আগে প্লাম্বারের প্রথম নিরাপত্তামূলক কাজ কী?", ["কাজের ঝুঁকি শনাক্ত করা", "যন্ত্রপাতি চালু করা", "পাইপ কাটা শুরু করা", "কাজের জায়গা ভিজিয়ে রাখা"], 0], ["OSH in Plumbing Workplace", "ব্যক্তিগত সুরক্ষা সরঞ্জাম (PPE) এর উদাহরণ কোনটি?", ["সেফটি হেলমেট, গ্লাভস ও সেফটি জুতা", "মোবাইল ফোন", "সাধারণ পোশাক", "কাগজ ও কলম"], 0], ["OSH in Plumbing Workplace", "ভেজা মেঝেতে কাজ করার সময় দুর্ঘটনা কমাতে কী করা উচিত?", ["সতর্কীকরণ চিহ্ন দেওয়া ও পানি পরিষ্কার করা", "দৌড়ে চলাচল করা", "বিদ্যুতের তার ফেলে রাখা", "কিছু না করা"], 0], ["OSH in Plumbing Workplace", "পাইপ কাটার সময় চোখ রক্ষায় কী ব্যবহার করতে হবে?", ["সেফটি গগলস", "কাপড়ের মাস্ক মাত্র", "স্যান্ডেল", "ক্যাপ"], 0], ["OSH in Plumbing Workplace", "কোনো বৈদ্যুতিক যন্ত্রে ত্রুটি দেখা দিলে কী করা উচিত?", ["ব্যবহার বন্ধ করে বিদ্যুৎ সংযোগ বিচ্ছিন্ন ও দায়িত্বপ্রাপ্ত ব্যক্তিকে জানানো", "নিজে ভেজা হাতে মেরামত করা", "তার জোড়া দিয়ে চালানো", "পানির মধ্যে রাখা"], 0], ["OSH in Plumbing Workplace", "বন্ধ বা সীমাবদ্ধ স্থানে (confined space) প্রবেশের আগে কী প্রয়োজন?", ["অনুমতি, বায়ু/গ্যাস পরীক্ষা ও উদ্ধার পরিকল্পনা", "শুধু টর্চ", "দ্রুত প্রবেশ", "কোনো পরীক্ষা নয়"], 0], ["OSH in Plumbing Workplace", "পাইপে কাজের আগে পানি বা গ্যাসের লাইন নিরাপদ করার সঠিক পদ্ধতি কী?", ["সাপ্লাই বন্ধ, আইসোলেট ও চাপমুক্ত করা", "চাপ থাকা অবস্থায় কাটা", "ভালভ খোলা রাখা", "শুধু টেপ লাগানো"], 0], ["OSH in Plumbing Workplace", "উঁচু স্থানে পাইপ বসানোর সময় কোনটি ব্যবহার করা উচিত?", ["নিরাপদ ও পরিদর্শিত মই/স্ক্যাফোল্ড", "ভাঙা চেয়ার", "পাইপের ওপর দাঁড়ানো", "ঢিলা বাক্স"], 0], ["OSH in Plumbing Workplace", "ভারী পাইপ তোলার সময় কোমরের আঘাত এড়াতে কী করা উচিত?", ["হাঁটু ভাঁজ করে সঠিক ভঙ্গিতে তোলা এবং প্রয়োজন হলে সহায়তা নেওয়া", "কোমর বাঁকিয়ে ঝাঁকুনি দিয়ে তোলা", "এক হাতে টানা", "দৌড়ে বহন করা"], 0], ["OSH in Plumbing Workplace", "কাজের জায়গায় আগুন লাগলে প্রথম করণীয় কী?", ["সতর্ক করা, নিরাপদে সরে যাওয়া এবং জরুরি নিয়ম অনুসরণ", "আগুনের কাছে দাঁড়িয়ে থাকা", "পানি ছিটানো—যে কোনো আগুনে", "দরজা বন্ধ করে লুকানো"], 0], ["OSH in Plumbing Workplace", "রাসায়নিক ক্লিনার ব্যবহারের আগে কী পড়তে হবে?", ["লেবেল ও Safety Data Sheet (SDS)", "কর্মীর পরিচয়পত্র", "যন্ত্রের রং", "কাজের সময়সূচি"], 0], ["OSH in Plumbing Workplace", "রাসায়নিক পদার্থ হাতে লাগলে কী করা উচিত?", ["নির্দেশনা অনুযায়ী প্রচুর পানি দিয়ে ধুয়ে প্রয়োজনীয় চিকিৎসা নেওয়া", "কাপড়ে মুছে কাজ চালানো", "অন্য রাসায়নিক দিয়ে ঘষা", "কিছু না করা"], 0], ["OSH in Plumbing Workplace", "পাইপ কাটার বা গ্রাইন্ডার ব্যবহারের সময় কোনটি নিরাপদ?", ["গার্ড ঠিক রাখা ও সঠিক PPE ব্যবহার", "গার্ড খুলে কাজ করা", "ঢিলা পোশাক পরা", "চলন্ত ব্লেডে হাত দেওয়া"], 0], ["OSH in Plumbing Workplace", "কাজের জায়গায় ছড়িয়ে থাকা পাইপ ও তার কীভাবে রাখা উচিত?", ["নির্দিষ্ট স্থানে গুছিয়ে রাখা", "চলাচলের পথে ফেলে রাখা", "দরজার সামনে রাখা", "সিঁড়িতে রাখা"], 0], ["OSH in Plumbing Workplace", "কোনো কর্মী আহত হলে প্রথমে কী করতে হবে?", ["কাজ নিরাপদ করা, প্রাথমিক চিকিৎসা দেওয়া এবং জরুরি সহায়তা ডাকা", "আহত ব্যক্তিকে একা ফেলে রাখা", "ঘটনা গোপন করা", "কাজ চালিয়ে যাওয়া"], 0], ["OSH in Plumbing Workplace", "প্লাম্বিংয়ের কাজে শব্দ বেশি হলে কোন PPE ব্যবহার করা যায়?", ["ইয়ার প্লাগ বা ইয়ার মাফ", "সানগ্লাস", "কটন গ্লাভস", "এপ্রোন"], 0], ["OSH in Plumbing Workplace", "ড্রিল মেশিন ব্যবহারের আগে কী পরীক্ষা করা জরুরি?", ["কেবল, প্লাগ, বিট ও যন্ত্রের অবস্থা", "শুধু রং", "কর্মীর জুতা", "কাজের কাগজ"], 0], ["OSH in Plumbing Workplace", "গ্যাসের গন্ধ পাওয়া গেলে কী করা উচিত?", ["আগুন/সুইচ ব্যবহার না করে এলাকা ত্যাগ, সতর্ক করা ও জরুরি কর্তৃপক্ষকে জানানো", "লাইটার জ্বালিয়ে পরীক্ষা", "বৈদ্যুতিক সুইচ অন করা", "সঙ্গে সঙ্গে পাইপ কাটা"], 0], ["OSH in Plumbing Workplace", "কাজ শেষে OSH অনুযায়ী কী করা উচিত?", ["যন্ত্রপাতি বন্ধ ও সংরক্ষণ, বর্জ্য অপসারণ এবং স্থান পরিষ্কার", "যন্ত্র চালু রেখে চলে যাওয়া", "বর্জ্য ড্রেনে ফেলা", "PPE ফেলে রাখা"], 0], ["OSH in Plumbing Workplace", "কর্মক্ষেত্রে দুর্ঘটনা বা near miss ঘটলে কী করা উচিত?", ["রিপোর্ট করে কারণ শনাক্ত ও প্রতিরোধমূলক ব্যবস্থা নেওয়া", "কাউকে না জানানো", "শুধু মৌখিকভাবে ভুলে যাওয়া", "প্রমাণ সরিয়ে ফেলা"], 0]];
let current=0;const answers=Array(questions.length).fill(null);
const quiz=document.getElementById('quiz');
function update(){let n=answers.filter(v=>v!==null).length;document.getElementById('count').textContent=`উত্তর দিয়েছেন: ${n}/২০ • প্রশ্ন ${current+1}/২০`;document.getElementById('bar').style.width=(n/20*100)+'%';}
function render(){
 const q=questions[current];
 const options=q[2].map((o,i)=>`<label class="option ${answers[current]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}>${String.fromCharCode(65+i)}. ${o}</label>`).join('');
 quiz.innerHTML=`<section class="question"><div class="unit">${q[0]}</div><div class="qtop"><span class="num">${current+1}/২০</span><div style="flex:1"><h3>${q[1]}</h3>${options}<div id="feedback" class="feedback"></div></div></div><div class="nav"><button class="secondary" id="prev" ${current===0?'disabled':''}>← আগের প্রশ্ন</button><button class="primary" id="next">${current===19?'ফলাফল দেখুন':'পরের প্রশ্ন →'}</button></div></section>`;
 quiz.querySelectorAll('input').forEach(el=>el.addEventListener('change',()=>{answers[current]=Number(el.value);feedback();update();}));
 document.getElementById('prev').onclick=()=>{if(current>0){current--;render();}};
 document.getElementById('next').onclick=()=>{if(current<19){current++;render();}else showResult();};
 feedback();update();
}
function feedback(){const f=document.getElementById('feedback');if(!f)return;const a=answers[current];if(a===null){f.textContent='';return;}if(a===questions[current][3]){f.textContent='সঠিক উত্তর!';f.className='feedback good';}else{f.textContent='ভুল উত্তর। সঠিক উত্তর: '+String.fromCharCode(65+questions[current][3])+'. '+questions[current][2][questions[current][3]];f.className='feedback bad';}}
function showResult(){let score=0,done=0;answers.forEach((a,i)=>{if(a!==null){done++;if(a===questions[i][3])score++;}});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>আপনার ফলাফল</h2><div class="score">${score} / ২০</div><p>উত্তর দিয়েছেন ${done}টি • সঠিক ${score}টি • ভুল ${done-score}টি • অনুত্তরিত ${20-done}টি</p><p>${score>=18?'চমৎকার!':score>=14?'ভালো করেছেন!':score>=10?'আরও অনুশীলন করুন।':'আবার অনুশীলন করে দেখুন।'}</p>`;r.scrollIntoView({behavior:'smooth'});}
function resetQuiz(){if(!confirm('সব উত্তর মুছে আবার শুরু করবেন?'))return;answers.fill(null);current=0;document.getElementById('result').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'});}
render();
</script></body></html>
