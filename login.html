<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Salim Learning Point</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><h1>🎓 Salim Learning Point</h1><p>Student Login</p></header>
<main class="container">
<section class="card form-card">
<h2>🔐 Login করুন</h2>
<p class="muted">একবার Login করলে এই ব্রাউজার ট্যাবে সব মেনু ব্যবহার করতে পারবেন।</p>
<form onsubmit="event.preventDefault(); slpLogin();">
<label for="username">Username</label>
<input id="username" autocomplete="username" required placeholder="Username">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required placeholder="Password">
<button class="btn" type="submit" style="width:100%">Login</button>
<p id="loginMessage" style="color:#dc2626" role="alert"></p>
</form>
</section>
</main>
<script src="script.js"></script>
</body></html>
