<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work in the Team Environment - 20 MCQ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans Bengali",Arial,sans-serif;background:linear-gradient(135deg,#e0f2fe,#ede9fe 48%,#fce7f3);color:#1e293b}
.wrap{max-width:880px;margin:32px auto;padding:18px}.quiz{background:#fff;border-radius:22px;padding:28px;box-shadow:0 16px 45px #33415525;border:1px solid #ffffff}
.header{background:linear-gradient(110deg,#075985,#4f46e5,#9333ea);color:white;padding:24px;border-radius:17px;margin:-4px -4px 24px;text-align:center}
h1{font-size:25px;margin:0 0 8px}.sub{margin:0;color:#e0e7ff}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;color:#475569;margin-bottom:12px}
.bar{height:11px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-bottom:24px}.fill{height:100%;width:0;background:linear-gradient(90deg,#06b6d4,#22c55e,#a3e635);transition:.25s}
.q{font-size:20px;font-weight:800;line-height:1.65;color:#312e81;margin:12px 0 18px}
.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:11px 0;border:2px solid #e2e8f0;border-radius:12px;background:#f8fafc;font-size:16px;cursor:pointer;color:#263445;transition:.15s}
.option:hover:not(:disabled){background:#eff6ff;border-color:#60a5fa;transform:translateX(3px)}.option:disabled{cursor:default}
.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:700}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{min-height:50px;padding:13px 15px;border-radius:11px;margin-top:16px;line-height:1.55;background:#eef2ff;color:#3730a3;border-left:5px solid #6366f1}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
button.nav{border:0;border-radius:11px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(110deg,#0284c7,#4f46e5);color:white;box-shadow:0 4px 10px #4f46e533}
button.nav:hover:not(:disabled){filter:brightness(1.08)}button.nav:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}button.reset{background:linear-gradient(110deg,#f97316,#db2777)}
.result{text-align:center;padding:28px;background:linear-gradient(135deg,#ecfeff,#f0fdf4);border-radius:16px}.score{font-size:38px;color:#15803d;font-weight:900}
@media(max-width:600px){.wrap{margin:8px auto;padding:10px}.quiz{padding:17px}.header{padding:20px 12px}h1{font-size:21px}.q{font-size:18px}}
@media print{body{background:white}.controls{display:none}.quiz{box-shadow:none}}
</style></head>
<body><div class="wrap"><main class="quiz">
<div class="header"><h1>Work in the Team Environment</h1><p class="sub">২০টি বহুনির্বাচনী প্রশ্ন (MCQ)</p></div>
<div id="quizArea"><div class="top"><span id="count">প্রশ্ন ১ / ২০</span><span id="answered">উত্তর দেওয়া হয়েছে: ০</span></div>
<div class="bar"><div class="fill" id="progress"></div></div><div class="q" id="question"></div><div id="options"></div>
<div class="feedback" id="feedback">সঠিক উত্তর নির্বাচন করুন।</div>
<div class="controls"><button class="nav" id="prev" onclick="move(-1)">আগের প্রশ্ন</button><button class="nav" id="next" onclick="move(1)">পরের প্রশ্ন</button></div></div>
<div id="result" class="result" hidden></div>
<div class="controls"><button class="nav reset" onclick="restart()">আবার শুরু করুন</button><button class="nav" onclick="window.print()">প্রিন্ট করুন</button></div>
</main></div>
<script>
const questions=[["What is a team?", ["একজন কর্মীর কাজ", "একদল মানুষ যারা একটি সাধারণ লক্ষ্য অর্জনে একসঙ্গে কাজ করে", "শুধু একজন ব্যবস্থাপক", "একটি যন্ত্র"], 1, "একটি সাধারণ লক্ষ্য অর্জনে একসঙ্গে কাজ করা মানুষের দলকে Team বলে।"], ["Why is teamwork important in the workplace?", ["কাজে বিলম্ব করতে", "ভুল বোঝাবুঝি বাড়াতে", "কাজ দক্ষভাবে সম্পন্ন করতে", "দায়িত্ব এড়িয়ে যেতে"], 2, "দলগত কাজ কাজের গতি, দক্ষতা ও মান উন্নত করে।"], ["Which quality is important for a good team member?", ["সহযোগিতা", "অহংকার", "অবহেলা", "অসৌজন্য"], 0, "সহযোগিতার মনোভাব একজন ভালো দলীয় সদস্যের গুরুত্বপূর্ণ গুণ।"], ["What should you do when a team member is speaking?", ["মাঝখানে বাধা দেওয়া", "মনোযোগ দিয়ে শোনা", "উপেক্ষা করা", "অন্যের সঙ্গে কথা বলা"], 1, "দলের সদস্যের কথা মনোযোগ দিয়ে শোনা কার্যকর যোগাযোগের অংশ।"], ["What is the best way to handle disagreement in a team?", ["ঝগড়া করা", "অন্যকে দোষ দেওয়া", "শান্তভাবে আলোচনা করে সমাধান খোঁজা", "কাজ বন্ধ করে দেওয়া"], 2, "মতভেদ হলে শান্ত ও সম্মানজনক আলোচনার মাধ্যমে সমাধান খুঁজতে হয়।"], ["What does cooperation mean?", ["একসঙ্গে কাজ করা ও সাহায্য করা", "নিজের কাজ লুকানো", "অন্যকে বাধা দেওয়া", "দায়িত্ব অস্বীকার করা"], 0, "Cooperation অর্থ পারস্পরিক সহযোগিতা করা।"], ["Who is responsible for completing an assigned task?", ["শুধু দলনেতা", "যে সদস্যকে দায়িত্ব দেওয়া হয়েছে", "অন্য দল", "কেউ নয়"], 1, "প্রত্যেক সদস্য তার ওপর অর্পিত কাজ সম্পন্ন করার জন্য দায়িত্বশীল।"], ["What should you do if you cannot complete your task on time?", ["কাউকে না জানানো", "কাজ ফেলে চলে যাওয়া", "দলনেতা বা সংশ্লিষ্ট সদস্যকে দ্রুত জানানো", "অন্যকে দোষ দেওয়া"], 2, "সময়সীমায় কাজ শেষ করা সম্ভব না হলে দ্রুত দলকে জানানো উচিত।"], ["What is the role of a team leader?", ["দলের কাজ সমন্বয় ও দিকনির্দেশনা দেওয়া", "সব কাজ বন্ধ রাখা", "সদস্যদের কথা না শোনা", "শুধু নিজের কাজ করা"], 0, "দলনেতা দলের কাজ সমন্বয় করেন এবং প্রয়োজনীয় দিকনির্দেশনা দেন।"], ["Which action builds trust among team members?", ["তথ্য গোপন করা", "কথা ও কাজে নির্ভরযোগ্য থাকা", "প্রতিশ্রুতি ভঙ্গ করা", "গুজব ছড়ানো"], 1, "কথা ও কাজে নির্ভরযোগ্য হলে দলের সদস্যদের মধ্যে আস্থা তৈরি হয়।"], ["Why should workplace instructions be followed?", ["কাজ নিরাপদ ও সঠিকভাবে সম্পন্ন করতে", "কাজ কঠিন করতে", "সময় নষ্ট করতে", "দলের ক্ষতি করতে"], 0, "নির্দেশনা অনুসরণ করলে কাজ নিরাপদ, সঠিক ও নিয়মমাফিক হয়।"], ["What should you do when a new member joins your team?", ["তাকে উপেক্ষা করা", "তার কাজ নিয়ে হাসাহাসি করা", "তাকে স্বাগত জানিয়ে প্রয়োজনীয় তথ্য দেওয়া", "তাকে দল থেকে বাদ দেওয়া"], 2, "নতুন সদস্যকে স্বাগত জানিয়ে কাজের নিয়ম ও প্রয়োজনীয় তথ্য জানানো উচিত।"], ["Which is an example of positive communication?", ["রূঢ়ভাবে কথা বলা", "স্পষ্ট ও সম্মানজনকভাবে মতামত দেওয়া", "চিৎকার করা", "অন্যের কথা কেটে দেওয়া"], 1, "স্পষ্ট ও সম্মানজনক যোগাযোগ দলীয় সম্পর্ক ভালো রাখে।"], ["What is conflict in a team?", ["সবার একই মত থাকা", "দলীয় সাফল্য", "মতামত বা স্বার্থের বিরোধ", "কাজ ভাগ করা"], 2, "দলের সদস্যদের মধ্যে মতামত বা স্বার্থের বিরোধকে Conflict বলা হয়।"], ["How can a team achieve its goal effectively?", ["পরিকল্পনা, দায়িত্ব বণ্টন ও সহযোগিতার মাধ্যমে", "কোনো পরিকল্পনা ছাড়া", "দায়িত্ব এড়িয়ে", "একজনের ওপর সব কাজ দিয়ে"], 0, "পরিকল্পনা, দায়িত্ব বণ্টন ও সহযোগিতা দলকে লক্ষ্য অর্জনে সাহায্য করে।"], ["What should you do if you notice an unsafe situation at work?", ["চুপ থাকা", "অন্যকে উৎসাহিত করা", "নিরাপত্তা নিয়ম মেনে দ্রুত সংশ্লিষ্ট ব্যক্তিকে জানানো", "কাজ চালিয়ে যাওয়া"], 2, "ঝুঁকিপূর্ণ অবস্থা দেখলে নিরাপত্তা বিধি মেনে দ্রুত রিপোর্ট করতে হয়।"], ["Why is sharing information important in a team?", ["ভুল বোঝাবুঝি বাড়ায়", "সবাইকে কাজ সম্পর্কে অবগত রাখে", "কাজ বন্ধ করে", "দায়িত্ব কমায়"], 1, "তথ্য ভাগাভাগি করলে দলের সবাই কাজের অবস্থা ও প্রয়োজন বুঝতে পারে।"], ["What does punctuality mean in teamwork?", ["সময়মতো উপস্থিত হওয়া ও কাজ করা", "ইচ্ছামতো দেরি করা", "কাজ ফেলে রাখা", "অনুমতি ছাড়া চলে যাওয়া"], 0, "Punctuality অর্থ সময়নিষ্ঠা—সময়মতো উপস্থিত থাকা ও কাজ করা।"], ["How should team members treat each other?", ["অসম্মান করে", "বৈষম্য করে", "সম্মান ও ন্যায্যতার সঙ্গে", "অবহেলা করে"], 2, "দলের প্রত্যেক সদস্যকে সম্মান ও ন্যায্যতার সঙ্গে আচরণ করতে হবে।"], ["What is the benefit of reviewing team performance?", ["ভুল ও উন্নতির জায়গা চিহ্নিত করা", "দায়িত্ব এড়িয়ে যাওয়া", "দল ভেঙে দেওয়া", "কাজের মান কমানো"], 0, "কাজ পর্যালোচনা করলে ভুল, সাফল্য ও উন্নতির সুযোগ চিহ্নিত করা যায়।"]];let current=0,answers={};
function render(){const q=questions[current];document.getElementById('count').textContent=`প্রশ্ন ${current+1} / ${questions.length}`;document.getElementById('answered').textContent=`উত্তর দেওয়া হয়েছে: ${Object.keys(answers).length}`;document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';document.getElementById('question').textContent=(current+1)+'. '+q[0];const box=document.getElementById('options');box.innerHTML='';
q[1].forEach((op,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+op;b.disabled=answers[current]!==undefined;if(answers[current]!==undefined){if(i===q[2])b.classList.add('correct');else if(i===answers[current])b.classList.add('wrong')}b.onclick=()=>{answers[current]=i;render()};box.appendChild(b)});
const fb=document.getElementById('feedback');if(answers[current]===undefined)fb.textContent='সঠিক উত্তর নির্বাচন করুন।';else fb.textContent=(answers[current]===q[2]?'✅ সঠিক উত্তর! ':'❌ ভুল উত্তর। সঠিক উত্তর: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]+'। ')+q[3];
document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===questions.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন'}
function move(d){if(d===1&&current===questions.length-1){showResult();return}current=Math.max(0,Math.min(questions.length-1,current+d));render()}
function showResult(){const score=questions.reduce((s,q,i)=>s+(answers[i]===q[2]?1:0),0);document.getElementById('quizArea').hidden=true;const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<h2>🎉 কুইজ সম্পন্ন!</h2><div class="score">${score} / ${questions.length}</div><p>আপনার সঠিক উত্তর ${score}টি।</p><p>প্রাপ্ত নম্বর: ${Math.round(score/questions.length*100)}%</p>`}
function restart(){current=0;answers={};document.getElementById('quizArea').hidden=false;document.getElementById('result').hidden=true;render()}render();
</script></body></html>
